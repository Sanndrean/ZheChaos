<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101021">
  <meta name="description" content="ZheChaos — party game realtime bareng teman.">
  <title>ZheChaos — Chaos starts here</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg-glow glow-a"></div><div class="bg-glow glow-b"></div>
  <div id="app" aria-live="polite"></div>
  <audio id="background-music" loop preload="none"></audio>
  <button id="music-toggle" class="music-toggle" type="button" aria-label="Putar musik latar" aria-pressed="false" title="Musik latar">♪</button>
  <div id="toast" class="toast" role="status"></div>
  <div id="loading" class="loading-screen hidden" aria-live="assertive">
    <div class="loading-orbit"><span></span><span></span><span></span></div>
    <strong id="loading-title">Menyiapkan room</strong><small id="loading-subtitle">Menghubungkan pemain…</small>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
